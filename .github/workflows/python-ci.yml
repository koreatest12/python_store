name: Python CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14.7"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Show Python version
        run: python --version

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Run application smoke test
        run: python main.py "안녕하세요 Python tokenizer 3.14!"

      - name: Run tokenizer tests
        run: python -m unittest discover -s tests -v

      - name: Train BPE model
        run: python train_tokenizer.py bpe examples/corpus.txt --output /tmp/bpe.json --vocab-size 64

      - name: Train WordPiece model
        run: python train_tokenizer.py wordpiece examples/corpus.txt --output /tmp/wordpiece.json --vocab-size 64

      - name: Train SentencePiece-style model
        run: python train_tokenizer.py sentencepiece examples/corpus.txt --output /tmp/sentencepiece.json --vocab-size 64

      - name: Verify tokenizer model files
        run: |
          test -s /tmp/bpe.json
          test -s /tmp/wordpiece.json
          test -s /tmp/sentencepiece.json

      - name: Compile Python sources
        run: python -m compileall -q .
