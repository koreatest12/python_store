name: Python CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14.7"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Show Python version
        run: python --version

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Run application smoke test
        run: python main.py "안녕하세요 Python tokenizer 3.14!"

      - name: Run tokenizer tests
        run: python -m unittest discover -s tests -v

      - name: Train downloadable tokenizer models
        run: |
          mkdir -p build/models
          python train_tokenizer.py bpe examples/corpus.txt --output build/models/bpe.json --vocab-size 64
          python train_tokenizer.py wordpiece examples/corpus.txt --output build/models/wordpiece.json --vocab-size 64
          python train_tokenizer.py sentencepiece examples/corpus.txt --output build/models/sentencepiece.json --vocab-size 64

      - name: Register models in token repository
        run: |
          python token_repository.py add build/models/bpe.json --name korean-demo --type bpe --version 1.0.0
          python token_repository.py add build/models/wordpiece.json --name korean-demo --type wordpiece --version 1.0.0
          python token_repository.py add build/models/sentencepiece.json --name korean-demo --type sentencepiece --version 1.0.0

      - name: Verify token repository
        run: python token_repository.py verify

      - name: Build token download bundle
        run: python token_repository.py export

      - name: Verify download bundle
        run: |
          test -s token_repository/downloads/python-token-repository.zip
          test -s token_repository/downloads/token-models/manifest.json
          test -s token_repository/downloads/token-models/SHA256SUMS.txt

      - name: Upload tokenizer download repository
        uses: actions/upload-artifact@v7
        with:
          name: python-token-repository
          path: |
            token_repository/downloads/python-token-repository.zip
            token_repository/downloads/token-models/
          if-no-files-found: error
          retention-days: 30

      - name: Prepare pre-tokenized JSONL dataset
        run: python prepare_dataset.py examples/dataset.jsonl --format jsonl --output build/pretokenized-jsonl.jsonl --lowercase

      - name: Prepare pre-tokenized CSV dataset
        run: python prepare_dataset.py examples/dataset.csv --format csv --output build/pretokenized-csv.jsonl

      - name: Verify prepared datasets
        run: |
          test -s build/pretokenized-jsonl.jsonl
          test -s build/pretokenized-csv.jsonl

      - name: Compile Python sources
        run: python -m compileall -q .
